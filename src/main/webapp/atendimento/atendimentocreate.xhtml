<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Atendimentos</title>

</h:head>

<h:body>

    <ui:include src="/WEB-INF/menu.xhtml"/>

    <h:outputStylesheet library="css" name="headerStyle.css"/>
    <h1>Cadastro de Atendimentos</h1>
    <br/>

    <p:messages id="messages" showDetail="true" closable="true">
        <p:autoUpdate/>
    </p:messages>

    <h:form id="formAtendimentos">
        <p:confirmDialog global="true" showEffect="fade" responsive="true" width="350">
            <p:commandButton value="Sim" type="button"
                             styleClass="ui-confirmdialog-yes"/>
            <p:commandButton value="Não" type="button"
                             styleClass="ui-confirmdialog-no ui-button-flat"/>
        </p:confirmDialog>

        <p:panelGrid columns="2">
            <p:outputLabel value="Código: "/>
            <p:inputText value="#{atendimentoBean.atendimento.codigo}" disabled="true"/>

            <p:outputLabel value="Assistido: "/>
            <p:autoComplete value="#{atendimentoBean.atendimento.assistido}"
                            completeMethod="#{atendimentoBean.buscarAssistidos}"
                            var="assistido"
                            itemLabel="#{assistido.nome}"
                            itemValue="#{assistido}"
                            converter="assistidoConverter"
                            minQueryLength="3"
                            forceSelection="true"
                            placeholder="Digite o nome..."
                            dropdown="true"
                            required="true"/>


            <p:outputLabel value="Data: "/>
            <p:datePicker id="data" pattern="dd/MM/yyyy"
                          placeholder="Selecione uma data"
                          value="#{atendimentoBean.atendimento.data}"/>

            <p:outputLabel value="Situação: "/>
            <p:selectOneMenu id="situacao" value="#{atendimentoBean.atendimento.situacao}">
                <f:selectItem itemValue="" itemLabel="[--Selecione--]" noSelectionOption="true"/>
                <f:selectItems value="#{atendimentoBean.estados()}" var="s"
                               itemValue="#{s}"/>
            </p:selectOneMenu>

            <p:outputLabel value="Atendente: "/>
            <p:inputText value="#{atendimentoBean.atendimento.atendente}"/>

        </p:panelGrid>
    <br/>

        <h:column>
            <h:outputLabel />
            <h:panelGroup rendered="#{pessoaBean.permiteAcesso('ADMINISTRADOR')}">

                <p:commandButton value="Novo" action="#{atendimentoBean.novo()}"
                                 update="formAtendimentos lista_atendimentos"
                                 style="background-color: #13aa52;border-color: #13aa52"
                                 icon="pi pi-plus" id="botaoNovo" title="Novo" />

                <p:commandButton icon="pi pi-save" value="Salvar"
                                 action="#{atendimentoBean.salvar()}"
                                 style="margin-left:1cm"
                                 update="formAtendimentos lista_atendimentos"
                                 title="Salvar"
                                 validateClient="true" ajax="false"/>

                <p:commandButton action="#{atendimentoBean.limparFormulario()}"
                                 value="Limpar" title="Limpar" immediate="true"
                                 style="background-color: goldenrod;border-color: goldenrod;margin-left:1cm"
                                 icon="pi pi-refresh" id="botaoLimpar"
                                 update="formAtendimentos"
                />
            </h:panelGroup>
        </h:column>
    </h:form>


<br/><br/>


    <p:dataTable id="lista_atendimentos" widgetVar="lista_atendimentos" value="#{atendimentoBean.atendimentos}" var="l"
                     rows="10" paginatorPosition="bottom" paginator="true"
                     emptyMessage="Nenhuma informação a ser exibida." border="3">
        <f:facet name="header">Lista de Atendimentos</f:facet>

        <p:column sortBy="#{l.codigo}" headerText="#ID">
            <h:outputLabel value="#{l.codigo}"/>
        </p:column>

        <p:column sortBy="#{l.assistido}" headerText="Assistido">
            <h:outputLabel value="#{l.assistido.nome}"/>
        </p:column>

        <p:column sortBy="#{l.data}" headerText="Data">
            <h:outputLabel value="#{l.data}"/>
        </p:column>

        <p:column sortBy="#{l.situacao}" headerText="Situação">
            <p:badge value="#{l.situacao}" severity="#{l.situacao eq 'AGENDADO' ? 'success' :
             (l.situacao eq 'FINALIZADO' ? 'info' :
             (l.situacao eq 'CORRENTE' ? 'warning' : 'default'))}" styleClass="mr-2"/>
        </p:column>

        <p:column headerText="Atendente">
            <h:outputLabel value="#{l.atendente}"/>
        </p:column>

        <p:column>
            <f:facet name="header">Ações</f:facet>

            <p:commandLink process="@this" title="Editar" update="formAtendimentos lista_atendimentos">
                <f:setPropertyActionListener value="#{l}" target="#{atendimentoBean.atendimento}"/>
                <i class="pi pi-pencil"/>
            </p:commandLink>
            &nbsp;
            <p:commandLink title="Remover" action="#{atendimentoBean.remover()}" process="@this"
                           update="formAtendimentos lista_atendimentos">
                <f:setPropertyActionListener value="#{l}" target="#{atendimentoBean.atendimento}"/>
                <p:confirm icon="ui-icon-alert" header="Confirmação de exclusão"
                           message="Deseja mesmo excluir o atendimento?"/>
                <i class="pi pi-trash"/>
            </p:commandLink>
        </p:column>
    </p:dataTable>


</h:body>
</html>
